<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Jugador</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow" style="width: 100%; max-width: 500px;">
        <div class="card-header bg-primary text-white">
            <!-- El título cambia dinámicamente si es nuevo o edición -->
            <h3 class="mb-0 text-center" th:text="${jugador.id == null ? 'Registrar Jugador' : 'Editar Jugador'}"></h3>
        </div>
        <div class="card-body p-4">
            
            <form th:action="@{/jugadores/guardar}" th:object="${jugador}" method="post">
                <!-- Campo oculto para mantener el ID al editar -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">Nombre Completo:</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ej. Gael Fernando" required>
                </div>

                <div class="mb-3">
                    <label for="dorsal" class="form-label fw-bold">Dorsal (Número):</label>
                    <input type="number" class="form-control" id="dorsal" th:field="*{dorsal}" placeholder="Ej. 10" required>
                </div>

                <div class="mb-4">
                    <label for="equipo" class="form-label fw-bold">Equipo Asignado:</label>
                    <!-- El select lee la lista de equipos y asigna la FK al jugador -->
                    <select class="form-select" id="equipo" th:field="*{equipo.id}" required>
                        <option value="" disabled selected>Selecciona un equipo...</option>
                        <option th:each="equipo : ${equipos}" th:value="${equipo.id}" th:text="${equipo.nombre}"></option>
                    </select>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Guardar Registro</button>
                    <a th:href="@{/jugadores}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
