<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plantilla - Jugadores</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Gestión de Jugadores</h1>
        <a th:href="@{/jugadores/nuevo}" class="btn btn-success fw-bold">+ Agregar Nuevo Jugador</a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover table-bordered mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="text-center">ID</th>
                        <th>Nombre</th>
                        <th class="text-center">Dorsal</th>
                        <th>Equipo (Relación)</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Iteramos sobre la lista de jugadores que envía el Controller -->
                    <tr th:each="jugador : ${jugadores}">
                        <td class="text-center fw-bold" th:text="${jugador.id}"></td>
                        <td th:text="${jugador.nombre}"></td>
                        <td class="text-center">
                            <span class="badge bg-secondary fs-6" th:text="${jugador.dorsal}"></span>
                        </td>
                        <!-- Aquí se refleja la relación Muchos a Uno (@ManyToOne) -->
                        <td th:text="${jugador.equipo != null ? jugador.equipo.nombre : 'Sin equipo'}"></td>
                        <td class="text-center">
                            <a th:href="@{/jugadores/editar/{id}(id=${jugador.id})}" class="btn btn-warning btn-sm">Editar</a>
                            <a th:href="@{/jugadores/eliminar/{id}(id=${jugador.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar a este jugador?');">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
